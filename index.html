<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Komplex Gym — Registro</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; background: #111; color: #1a1a1a;
  font-family: "Segoe UI", Tahoma, Arial, sans-serif; font-size: 14px;
}
input, textarea, select, button { font-family: inherit; font-size: inherit; color: inherit; }

/* ---------- LAYOUT ---------- */
#app { display: flex; min-height: 100vh; }
#nav {
  width: 230px; min-width: 230px; background: #0d0d0d; color: #ddd;
  border-right: 3px solid #d40000; padding-bottom: 40px;
}
#main { flex: 1; background: #fff; min-width: 0; }

/* ---------- NAV ---------- */
.brand { padding: 18px 16px 14px; border-bottom: 1px solid #262626; }
.brand b { color: #fff; font-size: 20px; letter-spacing: 3px; display: block; }
.brand span { color: #d40000; font-size: 11px; letter-spacing: 2px; }
.navsearch { padding: 10px 12px; }
.navsearch input {
  width: 100%; padding: 6px 8px; background: #1c1c1c; color: #fff;
  border: 1px solid #333; border-radius: 3px;
}
.navgroup {
  padding: 14px 16px 4px; color: #777; font-size: 10px;
  letter-spacing: 2px; text-transform: uppercase;
}
.navitem {
  display: block; padding: 7px 16px; color: #ccc; cursor: pointer;
  border-left: 3px solid transparent; text-decoration: none;
}
.navitem:hover { background: #1a1a1a; color: #fff; }
.navitem.on { background: #1a1a1a; color: #fff; border-left-color: #d40000; font-weight: bold; }
.navitem .n { float: right; color: #666; font-size: 11px; font-weight: normal; }
.navadd { color: #d40000; font-size: 12px; padding: 6px 16px; cursor: pointer; }
.navadd:hover { text-decoration: underline; }

/* ---------- TOOLBAR ---------- */
#bar {
  background: #1a1a1a; color: #fff; padding: 8px 22px;
  border-bottom: 3px solid #d40000; overflow: hidden;
}
#bar .right { float: right; }
.btn {
  background: #2b2b2b; color: #eee; border: 1px solid #444; padding: 5px 11px;
  border-radius: 3px; cursor: pointer; margin-left: 5px;
}
.btn:hover { background: #3a3a3a; }
.btn.red { background: #d40000; border-color: #d40000; color: #fff; font-weight: bold; }
.btn.red:hover { background: #b00000; }
#estado { font-size: 12px; color: #8a8a8a; padding: 6px 0; display: inline-block; }

/* ---------- PAGE ---------- */
#page { padding: 24px 30px 80px; max-width: 1100px; }
h1.title { font-size: 27px; margin: 0 0 3px; color: #111; }
h1.title input {
  font-size: 27px; font-weight: bold; border: 0; border-bottom: 2px dashed #ccc;
  width: 100%; padding: 0 0 3px;
}
.sub { color: #888; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 22px; }
.sub b { color: #d40000; }

/* ---------- BLOQUES ---------- */
.bloque { border: 1px solid #e2e2e2; border-left: 4px solid #d40000; padding: 14px 18px; margin-bottom: 16px; }
.bloque h3 { margin: 0 0 8px; font-size: 17px; color: #111; }
.bloque h3 input { font-size: 17px; font-weight: bold; width: 100%; border: 0; border-bottom: 1px dashed #ccc; padding: 2px 0; }
.bloque p { margin: 0 0 9px; line-height: 1.62; text-align: justify; white-space: pre-wrap; }
.bloque textarea {
  width: 100%; min-height: 90px; padding: 9px; border: 1px solid #ddd;
  line-height: 1.6; resize: vertical;
}
.bloquebar { margin-top: 8px; padding-top: 8px; border-top: 1px dotted #ddd; }
.bloquebar .btn { background: #eee; color: #333; border-color: #ddd; font-size: 12px; margin: 0 4px 0 0; }
.bloquebar .btn:hover { background: #ddd; }

/* ---------- IMAGENES ---------- */
.imgs { margin: 10px 0 0; }
.thumb { display: inline-block; vertical-align: top; width: 210px; margin: 0 12px 12px 0; }
.thumb img { width: 100%; border: 1px solid #ddd; cursor: pointer; display: block; }
.thumb .pie { font-size: 11px; color: #666; padding: 4px 2px; text-align: center; }
.thumb .pie input { width: 100%; border: 0; border-bottom: 1px dashed #ccc; text-align: center; font-size: 11px; }
.thumb .del { color: #d40000; font-size: 11px; cursor: pointer; text-align: center; display: block; }
#lightbox {
  display: none; position: fixed; z-index: 99; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.9); text-align: center; cursor: zoom-out;
}
#lightbox img { max-width: 94%; max-height: 90%; margin-top: 3%; border: 2px solid #d40000; }

/* ---------- TABLA ---------- */
.tablabox { margin-top: 26px; overflow-x: auto; }
.tablahead { border-bottom: 3px solid #111; padding-bottom: 6px; margin-bottom: 0; overflow: hidden; }
.tablahead h2 { display: inline-block; margin: 0; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; }
.tablahead .right { float: right; }
.tablahead input.filtro { padding: 5px 8px; border: 1px solid #ccc; width: 200px; }
table { width: 100%; border-collapse: collapse; }
th {
  background: #111; color: #fff; text-align: left; padding: 7px 9px;
  font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: normal;
}
td { padding: 6px 9px; border-bottom: 1px solid #eee; vertical-align: top; }
tr.grupo td {
  background: #f4f4f4; font-weight: bold; font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; color: #d40000; border-bottom: 1px solid #ddd;
}
tr:hover td { background: #fbfbfb; }
tr.grupo:hover td { background: #f4f4f4; }
td input { width: 100%; border: 1px solid transparent; padding: 3px 4px; background: transparent; }
td input:focus { border-color: #d40000; background: #fff; outline: 0; }
.badge {
  display: inline-block; min-width: 20px; text-align: center; padding: 1px 6px;
  border-radius: 2px; font-weight: bold; font-size: 12px;
}
.e-A { background: #eee; color: #222; border: 1px solid #ccc; }
.e-B { background: #333; color: #fff; }
.e-C { background: #fff; color: #d40000; border: 1px solid #d40000; }
.e-D { background: #d40000; color: #fff; }
.delrow { color: #ccc; cursor: pointer; font-weight: bold; }
.delrow:hover { color: #d40000; }
.leyenda { margin-top: 10px; font-size: 11px; color: #777; }
.leyenda .badge { margin: 0 3px 0 12px; }
.resumen { margin: 0 0 14px; font-size: 12px; color: #555; }
.resumen b { color: #111; }
.vacio { padding: 26px; text-align: center; color: #999; border: 1px dashed #ddd; }

/* ---------- BUSCADOR ---------- */
.filtros {
  background: #f7f7f7; border: 1px solid #e2e2e2; border-left: 4px solid #d40000;
  padding: 14px 18px 6px; margin-bottom: 18px;
}
.filtros label {
  display: inline-block; vertical-align: top; margin: 0 18px 10px 0;
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #777;
}
.filtros select, .filtros input {
  display: block; margin-top: 4px; padding: 6px 7px; border: 1px solid #ccc;
  background: #fff; color: #111; font-size: 14px; min-width: 185px; max-width: 260px;
}
.filtros .btn { background: #eee; color: #333; border-color: #ddd; margin: 20px 0 0; }
.cnt { color: #d40000; font-size: 16px; }
.irarea { color: #d40000; cursor: pointer; }
.irarea:hover { text-decoration: underline; }

/* ---------- IMPRESION ---------- */
@media print {
  #nav, #bar, .bloquebar, .delrow, .navadd, .tablahead .right, .filtros .btn { display: none !important; }
  body, #main { background: #fff; }
  #page { padding: 0; max-width: none; }
  .bloque { border-color: #999; page-break-inside: avoid; }
  th { background: #000 !important; -webkit-print-color-adjust: exact; }
}
</style>
</head>

    }
    h += '<tr>';
    for (j = salta; j < p.cols.length; j++) {
      v = f[j] == null ? '' : f[j];
      if (edit) {
        h += '<td><input data-f="cel:' + i + ':' + j + '" value="' + esc(v) + '"></td>';
      } else if (p.grupo === 'inv' && j === 4 && v) {
        h += '<td><span class="badge e-' + esc(String(v).toUpperCase().charAt(0)) + '">' + esc(v) + '</span></td>';
      } else {
        h += '<td>' + esc(v) + '</td>';
      }
    }
    if (edit) { h += '<td><span class="delrow" data-a="delfila" data-i="' + i + '">&times;</span></td>'; }
    h += '</tr>';
  }
  h += '</table>';
  if (!vistos) {
    h += '<div class="vacio">' + (filtro ? 'Nada coincide con el filtro.' : 'Tabla vacía. Active el Modo edición para añadir filas.') + '</div>';
  }
  if (edit) {
    h += '<div style="margin-top:10px">';
    h += '<button class="btn red" data-a="addfila">+ Añadir fila</button>';
    if (p.grupo === 'inv') {
      h += '<button class="btn" data-a="delpag" style="float:right">Eliminar esta área</button>';
    }
    h += '</div>';
  }
  if (p.grupo === 'inv') {
    h += '<div class="leyenda">Escala de estado:' +
      '<span class="badge e-A">A</span> bueno<span class="badge e-B">B</span> deterioro leve' +
      '<span class="badge e-C">C</span> deterioro<span class="badge e-D">D</span> no funcional</div>';
  }
  return h;
}

function render() { renderNav(); renderPage(); }
function renderSoloTabla() { $('tablabox').innerHTML = renderTabla(); }

/* ---------------- EVENTOS ---------------- */
function onInput(ev) {
  var t = ev.target || ev.srcElement;
  if (t.id === 'navq') {
    navq = t.value;
    renderNav();
    var b = $('navq');
    if (b) { b.focus(); b.value = navq; }
    return;
  }
  var f = t.getAttribute ? t.getAttribute('data-f') : null;
  if (!f) return;
  var a = f.split(':'), p = pag();
  if (a[0] === 'titulo') { p.nombre = t.value; renderNav(); }
  else if (a[0] === 'bt') { p.bloques[+a[1]].t = t.value; }
  else if (a[0] === 'bx') { p.bloques[+a[1]].txt = t.value; crecer(t); }
  else if (a[0] === 'pie') { p.bloques[+a[1]].imgs[+a[2]].pie = t.value; }
  else if (a[0] === 'cel') { p.filas[+a[1]][+a[2]] = t.value; }
  else if (a[0] === 'bq') {
    bq[a[1]] = t.value;
    $('resultados').innerHTML = renderResultados();
    return;
  }
  else if (a[0] === 'filtro') {
    filtro = t.value;
    renderSoloTabla();
    var x = $('tablabox').getElementsByTagName('input')[0];
    if (x) { x.focus(); x.value = filtro; }
    return;
  } else { return; }
  tocar();
}

function onClick(ev) {
  var t = ev.target || ev.srcElement, a = null, i, j;
  while (t && t !== document.body) {
    a = t.getAttribute ? t.getAttribute('data-a') : null;
    if (a) break;
    t = t.parentNode;
  }
  if (!a) return;
  i = parseInt(t.getAttribute('data-i'), 10);
  j = parseInt(t.getAttribute('data-j'), 10);
  var p = pag();

  if (a === 'ir') {
    cur = i; filtro = navq; render(); window.scrollTo(0, 0);
  } else if (a === 'irarea') {
    cur = i; filtro = bq.txt; render(); window.scrollTo(0, 0);
  } else if (a === 'limpiar') {
    bq = { area: '', cat: '', est: '', txt: '' }; renderPage();
  } else if (a === 'nuevapag') {
    var n = prompt('Nombre de la nueva área:');
    if (!n) return;
    var pos = contarInv();
    D.paginas.splice(pos, 0, {
      nombre: n, grupo: 'inv', agrupa: true, tabla: 'Inventario del área',
      cols: ['Nivel', 'Categoría', 'Ítem / Elemento', 'Cantidad', 'Estado', 'Observación'],
      bloques: [], filas: []
    });
    cur = pos; guardar(); render();
  } else if (a === 'delpag') {
    if (!confirm('¿Eliminar el área "' + p.nombre + '" con todo su contenido?')) return;
    D.paginas.splice(cur, 1); cur = 0; guardar(); render();
  } else if (a === 'addbloque') {
    p.bloques.push({ t: 'Nuevo bloque', txt: '', imgs: [] }); guardar(); renderPage();
  } else if (a === 'delbloque') {
    if (confirm('¿Eliminar este bloque de texto?')) { p.bloques.splice(i, 1); guardar(); renderPage(); }
  } else if (a === 'up' && i > 0) {
    mover(p.bloques, i, i - 1); guardar(); renderPage();
  } else if (a === 'down' && i < p.bloques.length - 1) {
    mover(p.bloques, i, i + 1); guardar(); renderPage();
  } else if (a === 'addimg') {
    pendiente = i; $('fileImg').value = ''; $('fileImg').click();
  } else if (a === 'delimg') {
    if (confirm('¿Quitar esta imagen?')) { p.bloques[i].imgs.splice(j, 1); guardar(); renderPage(); }
  } else if (a === 'zoom') {
    $('lightimg').src = p.bloques[i].imgs[j].src;
    $('lightbox').style.display = 'block';
  } else if (a === 'addfila') {
    var nueva = [], k, ult = p.filas.length ? p.filas[p.filas.length - 1][0] : '';
    for (k = 0; k < p.cols.length; k++) { nueva.push(k === 0 && p.agrupa ? ult : ''); }
    p.filas.push(nueva); guardar(); renderSoloTabla();
  } else if (a === 'delfila') {
    if (confirm('¿Eliminar esta fila?')) { p.filas.splice(i, 1); guardar(); renderSoloTabla(); }
  }
}
function mover(arr, a, b) { var x = arr[a]; arr[a] = arr[b]; arr[b] = x; }
function contarInv() {
  var n = 0, i;
  for (i = 0; i < D.paginas.length; i++) { if (D.paginas[i].grupo === 'inv') n++; }
  return n;
}

/* ---------------- IMAGENES ---------------- */
function procesarImagen(file, cb) {
  var fr = new FileReader();
  fr.onload = function () {
    var img = new Image();
    img.onload = function () {
      var max = 1280, w = img.width, h = img.height, s;
      if (w > max || h > max) {
        s = Math.min(max / w, max / h);
        w = Math.round(w * s); h = Math.round(h * s);
      }
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      var x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
      x.drawImage(img, 0, 0, w, h);
      var out;
      try { out = c.toDataURL('image/jpeg', 0.75); } catch (e) { out = fr.result; }
      cb(out);
    };
    img.onerror = function () { cb(fr.result); };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------------- RESPALDO ---------------- */
function exportar() {
  var txt = JSON.stringify(D), nom = 'Komplex-respaldo.json';
  try {
    var blob = new Blob([txt], { type: 'application/json' });
    if (navigator.msSaveBlob) { navigator.msSaveBlob(blob, nom); return; }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nom;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch (e) {
    var w = window.open('', '_blank');
    w.document.write('<pre>' + esc(txt) + '</pre>');
  }
}
function importar(file) {
  var fr = new FileReader();
  fr.onload = function () {
    var n;
    try { n = JSON.parse(fr.result); } catch (e) { alert('El archivo no es un respaldo válido.'); return; }
    if (!n.paginas) { alert('El archivo no es un respaldo válido.'); return; }
    if (!confirm('¿Continuar? Esto reemplaza TODA la información actual.')) return;
    D = n; cur = 0; guardar(); render();
  };
  fr.readAsText(file);
}

/* ---------------- ARRANQUE ---------------- */
cargar();
render();
aviso(tam() + ' MB usados');

$('page').onclick = onClick;
$('nav').onclick = onClick;
$('page').oninput = onInput;
$('nav').oninput = onInput;
$('page').onchange = onInput;
$('nav').onchange = onInput;

$('bEdit').onclick = function () {
  edit = !edit;
  this.innerHTML = edit ? 'Terminar edición' : 'Modo edición';
  this.className = edit ? 'btn' : 'btn red';
  renderPage();
};
$('bExport').onclick = exportar;
$('bImport').onclick = function () { $('fileJson').value = ''; $('fileJson').click(); };
$('bPrint').onclick = function () { window.print(); };
$('lightbox').onclick = function () { this.style.display = 'none'; };
$('fileImg').onchange = function () {
  if (!this.files || !this.files[0] || pendiente < 0) return;
  aviso('Procesando imagen...');
  procesarImagen(this.files[0], function (src) {
    pag().bloques[pendiente].imgs.push({ src: src, pie: '' });
    pendiente = -1;
    guardar();
    renderPage();
  });
};
$('fileJson').onchange = function () { if (this.files && this.files[0]) importar(this.files[0]); };
document.onkeydown = function (e) { if (e.keyCode === 27) { $('lightbox').style.display = 'none'; } };
</script>
